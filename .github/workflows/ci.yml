name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Windows: install_sketchup_bridge tests use %APPDATA%-style paths.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcpb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcpb/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/unit-test.mjs
      - run: node scripts/smoke-test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sketchup-mcp-build
          retention-days: 14
          path: |
            mcpb/dist/*.mcpb
            mcpb/dist/*.rbz
            mcpb/dist/THIRD_PARTY_NOTICES.txt
